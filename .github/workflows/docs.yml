name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'meshes/**'
      - 'urdf/**'
      - 'RotaryInvertedPendulum-arduino/RLControl/**'
      - 'RotaryInvertedPendulum-arduino/PIDControl/TUNING_HISTORY.md'
      - 'RotaryInvertedPendulum-python/src/rl/pendulum_env.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'RotaryInvertedPendulum-arduino/RLControl/**'
      - '.github/workflows/docs.yml'
  # Allow a manual redeploy without an intervening commit.
  workflow_dispatch:

# Only one deploy at a time; cancel superseded builds on the same ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  # The demo's claim is that the network flashed on the Nano balances the
  # pendulum. These tests run the same modules the browser does, so a broken
  # control loop or a newly-exported policy that does not balance fails CI
  # instead of quietly shipping a spinning pendulum to the front page.
  test:
    name: Verify the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Prepare generated content
        run: node scripts/prepare.mjs

      - name: The policy still balances
        run: npm run test:policy

      - name: The 3D transform chain is correct
        run: npm run test:geometry

      - name: Build the site
        run: npm run build

      - name: The demo works in a real browser
        run: |
          npx astro preview --port 4322 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4322/rotary-inverted-pendulum/ >/dev/null && break
            sleep 1
          done
          npm run test:smoke

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only main deploys; pull requests get the verification above and nothing more.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
